# ---- Weights & Biases ----
wandb:
  entity: "prebenness-crl"
  project: "colored-mnist-vib"

# ---- Dataset ----
# Available: colored_mnist (2-class), irm_colored_mnist (2-class),
#            standard_mnist_bin (2-class), cmnist_ula (10-class)
# num_classes must match dataset (enforced at startup).
dataset:
  name: "cmnist_ula"
  p_train: 0.95
  p_test: 0.1

# ---- Model ----
# Architecture stays as code; this section selects which code path to use.
# mode: "single" (inner only) or "pair" (inner + outer with HSIC)
# inner: "vib_cnn" or "ula_mlp_var"
# outer: "std_cnn" or "ula_mlp" (only used when mode=pair)
model:
  mode: "pair"
  inner: "ula_mlp_var"
  outer: "ula_mlp"
  num_classes: 10
  bottleneck_width: 16
  outer_rep_dim: 100

# ---- Training ----
training:
  lr: 1.0e-3
  weight_decay_inner: 0.0
  weight_decay_outer: 0.0
  epochs: 50
  batch_size: 128
  seed: 0
  alpha: 0.01

# ---- ControlVAE controller ----
controller:
  beta_min: 0.0
  beta_max: 1.0
  ctrl_ki: 1.0

# ---- MC sampling ----
mc_samples:
  train: 2
  eval: 8

# ---- HSIC regularisation (pair mode only) ----
hsic:
  weight: 0.50

# ---- Lambda sweep ----
sweep:
  lambda_min_exp: -3
  lambda_max_exp: 3
  lambda_steps: 10
  log_sweep: true
