# ---- Weights & Biases ----
wandb:
  entity: "prebenness-crl"
  project: "colored-mnist-mdl"

# ---- Dataset ----
dataset:
  name: "colored_mnist"
  p_train: 0.9
  p_test: 0.1

# ---- Model ----
# MDL inner model + standard outer with HSIC decorrelation
model:
  mode: "mdl_pair"
  inner: "mdl_mlp"
  outer: "ula_mlp"
  num_classes: 10
  outer_rep_dim: 100

# ---- Training ----
training:
  lr: 1.0e-3
  weight_decay_inner: 0.0
  weight_decay_outer: 0.0
  epochs: 100
  batch_size: 128
  seed: 42

# ---- MDL config ----
mdl:
  n_max: 5
  m_max: 5
  tau_start: 2.0
  tau_end: 0.1
  warmup_epochs: 10
  n_samples: 1

# ---- HSIC regularisation (pair mode) ----
hsic:
  weight: 0.50

# ---- Lambda sweep (MDL penalty weight) ----
sweep:
  lambda_min_exp: -3
  lambda_max_exp: 1
  lambda_steps: 8
  log_sweep: true
