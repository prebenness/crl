# Reproduce Jan 28 hyperparams on binary ColoredMNIST with ULA MLP.
# Original used VIBClassifier (CNN, bottleneck=16); now using ula_mlp_var (MLP, bottleneck=50).

wandb:
  entity: "prebenness-crl"
  project: "colored-mnist-vib"

dataset:
  name: "colored_mnist"
  p_train: 0.9
  p_test: 0.1

model:
  mode: "single"
  inner: "ula_mlp_var"
  num_classes: 2
  bottleneck_width: 16    # ignored by ula_mlp_var (hardcoded 50)

training:
  lr: 1.0e-3
  weight_decay_inner: 1.0e-2
  weight_decay_outer: 0.0
  epochs: 5
  batch_size: 128
  seed: 0
  alpha: 0.01

dataloader:
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2

controller:
  beta_min: 0.0
  beta_max: 1.0
  ctrl_ki: 1.0

mc_samples:
  train: 2
  eval: 8

hsic:
  weight: 0.50

sweep:
  lambda_min_exp: -3
  lambda_max_exp: 3
  lambda_steps: 12
  log_sweep: true
