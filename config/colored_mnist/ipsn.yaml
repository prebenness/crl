wandb:
  entity: "prebenness-crl"
  project: "colored-mnist-vib"

dataset:
  name: "cmnist_ula"
  p_train: 0.95
  p_test: 0.1

model:
  mode: "ipsn"
  inner: "oracle_mlp"
  outer: "ipsn_mlp"
  num_classes: 10
  oracle_checkpoint: ""

training:
  lr: 1.0e-3
  weight_decay_inner: 1.0e-4
  epochs: 50
  batch_size: 128
  seed: 0
  alpha: 0.01

ipsn:
  c_dim: 50
  b_dim: 16
  num_colors: 10
  embed_dim: 16
  decoder_hidden: 64
  grad_rev_scale: 1.0
  lambda_color: 1.0
  gamma_adv: 0.5
  rho_recon: 0.1
  nu_cycle: 0.1

checkpointing:
  early_stopping_patience: 15

sweep:
  lambda_min_exp: 0
  lambda_max_exp: 0
  lambda_steps: 1
  log_sweep: true
