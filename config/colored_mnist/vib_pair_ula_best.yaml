# VIB pair sweep — ULA models with settings from best prior runs.
# Best final: 88.46% (lam=1e-3), Best peak: 88.96% (lam=3e-3)
# Both used alpha=1e-3, wd=1e-4, epochs=40.

wandb:
  entity: "prebenness-crl"
  project: "colored-mnist-vib"

dataset:
  name: "cmnist_ula"
  p_train: 0.95
  p_test: 0.1

model:
  mode: "pair"
  inner: "ula_mlp_var"
  outer: "ula_mlp"
  num_classes: 10
  bottleneck_width: 16
  outer_rep_dim: 100

training:
  lr: 1.0e-3
  weight_decay_inner: 1.0e-4
  weight_decay_outer: 1.0e-4
  epochs: 50
  batch_size: 128
  seed: 0
  alpha: 1.0e-3

dataloader:
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2

controller:
  beta_min: 0.0
  beta_max: 1.0
  ctrl_ki: 1.0

mc_samples:
  train: 2
  eval: 8

hsic:
  weight: 0.50

checkpointing:
  early_stopping_patience: 15

# Sweep around the range that worked well (1e-3 to 1e-1)
sweep:
  lambda_min_exp: -3
  lambda_max_exp: -1
  lambda_steps: 8
  log_sweep: true
