# VIB pair with MMD conditional invariance outer loss.
# Use with: python colored_mnist.py config/colored_mnist/vib_pair_mmd_sweep.yaml

wandb:
  entity: "prebenness-crl"
  project: "colored-mnist-vib"

dataset:
  name: "cmnist_ula"
  p_train: 0.95
  p_test: 0.1

model:
  mode: "pair"
  inner: "ula_mlp_var"
  outer: "ula_mlp"
  outer_loss: "mmd"
  num_classes: 10
  bottleneck_width: 16
  outer_rep_dim: 100

training:
  lr: 1.0e-3
  weight_decay_inner: 0.0
  weight_decay_outer: 0.0
  epochs: 50
  batch_size: 128
  seed: 0
  alpha: 0.01

dataloader:
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2

controller:
  beta_min: 0.0
  beta_max: 1.0
  ctrl_ki: 1.0

mc_samples:
  train: 2
  eval: 8

checkpointing:
  restart_patience: 3

mmd:
  weight: 1.0
  w_max: 500.0
  smoothing_eps: 1.0e-6

sweep:
  lambda_min_exp: -3
  lambda_max_exp: 3
  lambda_steps: 10
  log_sweep: true
